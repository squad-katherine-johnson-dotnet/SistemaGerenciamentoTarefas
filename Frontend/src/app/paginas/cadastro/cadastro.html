<div class="card-container">
  <h2>Cadastro de Usuária</h2>
  
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nome">Nome</label>
      <input type="text" id="nome" [(ngModel)]="usuario.nome" name="nome" required placeholder="Digite seu nome completo">
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" [(ngModel)]="usuario.email" name="email" required placeholder="seu.email@exemplo.com">
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" [(ngModel)]="usuario.senha" name="senha" required placeholder="Sua senha">
    </div>

    <button type="submit">Cadastrar</button>
  </form>

  <p *ngIf="mensagem" class="mensagem">{{ mensagem }}</p>
</div>
